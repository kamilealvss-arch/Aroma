services:
  postgres:
    image: postgres:16-alpine
    container_name: aroma_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aroma
      POSTGRES_PASSWORD: aroma123
      POSTGRES_DB: aroma_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aroma -d aroma_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
